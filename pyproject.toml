[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "little-workshop"
version = "0.1.0"
description = "Unified, self-hosted software project-management daemon absorbing little-requirements/little-versions/little-runner/little-pypi/bootstrap-little-project as pillars"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lws = "cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["common*", "core*", "orchestration*", "registry*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
