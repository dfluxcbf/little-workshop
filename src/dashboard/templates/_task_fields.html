  <label for="project">Project</label>
  <select name="project" id="project">
    {% for p in projects %}<option value="{{ p }}" {{ 'selected' if p == selected }}>{{ p }}</option>{% endfor %}
  </select>
  <label for="title">Title</label>
  <input type="text" name="title" id="title" required>
  <label for="description">Task</label>
  <textarea name="description" id="description" rows="6" placeholder="What should Claude do?"></textarea>
  <label for="intent">Kind of work</label>
  <select name="intent" id="intent">
    <option value="task">task</option><option value="bug">bug</option><option value="docs">docs</option><option value="milestone">milestone</option>
  </select>
  <label for="review_mode">Review</label>
  <select name="review_mode" id="review_mode">
    <option value="manual">Manual &mdash; I finish it</option><option value="auto_approve">Auto-approve when done and tests pass</option>
  </select>
  <label class="chip-check" style="margin-top:12px"><input type="hidden" name="include_standards" value="0"><input type="checkbox" name="include_standards" value="1" id="include_standards" {{ 'checked' if include_standards is not defined or include_standards }}><span>Include shared project standards</span></label>
  <p class="muted" style="margin:4px 0 0">Gives Claude a temporary, read-only copy of little-workshop&rsquo;s shared standards and this project&rsquo;s own folder. It is deleted when the task completes.</p>
