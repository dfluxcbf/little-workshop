{% extends "base.html" %}
{% block title %}New job — little-workshop{% endblock %}
{% block content %}
<h1>New job</h1>
<p class="lede">Choose a project, the job to run on it, and that job's options.</p>
<div class="panel" style="padding:18px 20px">
<form method="post" action="/jobs/new">
  {% include "_job_picker.html" %}
  {% if build_error %}<p class="muted" style="color:var(--fail)">{{ build_error }}</p>{% endif %}
  <div class="row" style="margin-top:12px"><button type="submit" class="primary" data-busy="Starting…">Start job</button></div>
</form>
</div>
{% endblock %}
